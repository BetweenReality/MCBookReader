
on:
    push:
        branches: ["main"]
    workflow_dispatch:

jobs:
    pyinstaller-build:
        runs-on: windows-latest
        steps:
            -
                name: Versatile PyInstaller
                uses: sayyid5416/pyinstaller@v1.8.0
                with:
                    spec: 'build.spec'
                    requirements: 'requirements.txt'
                    upload_exe_with_name: "BookReader"